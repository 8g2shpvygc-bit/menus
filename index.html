<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#2f855a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Menus de la semaine</title>
<style>
:root{--g:#2f855a;--g2:#e6f4ec;--bg:#f6f7f5;--tx:#1f2933;--mu:#6b7780;--bd:#dfe4e0;--wh:#fff;--rd:#c53030}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:75px}
header{background:var(--g);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--wh);border-top:1px solid var(--bd);z-index:5}
nav button{flex:1;padding:8px 0;border:0;background:none;font-size:12px;color:var(--mu)}
nav button.on{color:var(--g);font-weight:700}
nav button span{display:block;font-size:20px}
main{padding:12px;max-width:700px;margin:auto}
.card{background:var(--wh);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px}
.slot{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:14px;cursor:pointer}
.slot.first{border-top:0}
.slot .lbl{width:74px;color:var(--mu);font-size:12px;flex-shrink:0}
.slot .meal{flex:1}
.slot .meal b{display:block}
.slot .meta{font-size:11px;color:var(--mu)}
.empty{color:#a0aab2;font-style:italic}
button.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:14px;margin:2px 4px 2px 0}
button.btn.sec{background:var(--g2);color:var(--g)}
button.btn.dng{background:#fde8e8;color:var(--rd)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:15px;margin:4px 0 8px;font-family:inherit;background:#fff}
label{font-size:13px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--bd);font-size:13px;background:#fff}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.tag{display:inline-block;font-size:11px;background:var(--g2);color:var(--g);border-radius:10px;padding:2px 8px;margin:2px 4px 2px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:#fff;width:100%;max-width:700px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.row.done span.t{text-decoration:line-through;color:#a0aab2}
.row input[type=checkbox]{width:22px;height:22px;margin:0}
.row span.t{flex:1}
.row .x{color:var(--rd);border:0;background:none;font-size:18px}
.cat{font-size:12px;font-weight:700;color:var(--g);text-transform:uppercase;margin:14px 0 2px}
.tip{background:#fff8e1;border:1px solid #f3e0a0;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
.wk{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.wk button{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:8px 14px;font-size:16px}
</style>
</head>
<body>
<header><h1 id="title">🥗 Menus de la semaine</h1></header>
<main id="app"></main>
<nav id="nav"></nav>

<script>
const DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const SLOTS=[
 {id:"bk",label:"Petit-déj",ico:"☕"},
 {id:"lu",label:"Midi",ico:"🍽️"},
 {id:"sn",label:"Collation",ico:"🍎"},
 {id:"di",label:"Soir",ico:"🌙"}
];
const PEOPLE=[{id:"moi",label:"Moi",w:1},{id:"copine",label:"Copine",w:1},{id:"bebe",label:"Bébé",w:0.4}];
const CATS=["Fruits & légumes","Viandes & poissons","Crèmerie & œufs","Épicerie","Surgelés","Boulangerie","Autre"];

// Recettes de départ : ingrédients pour 1 adulte
const DEFAULT_RECIPES=[
{id:"r1",name:"Porridge banane-noix",time:5,tags:["petit-déj","rapide","sans cuisson"],batch:false,
 ing:[{n:"Flocons d'avoine",q:50,u:"g",c:"Épicerie"},{n:"Lait",q:200,u:"ml",c:"Crèmerie & œufs"},{n:"Banane",q:1,u:"pièce",c:"Fruits & légumes"},{n:"Noix",q:15,u:"g",c:"Épicerie"}],
 steps:"Chauffer flocons + lait 3 min (ou micro-ondes 2 min). Ajouter banane en rondelles et noix."},
{id:"r2",name:"Skyr, fruits & flocons",time:2,tags:["petit-déj","collation","sans cuisson","rapide"],batch:false,
 ing:[{n:"Skyr nature",q:150,u:"g",c:"Crèmerie & œufs"},{n:"Fruits de saison",q:1,u:"pièce",c:"Fruits & légumes"},{n:"Flocons d'avoine",q:25,u:"g",c:"Épicerie"}],
 steps:"Mélanger. Se transporte très bien au travail."},
{id:"r3",name:"Œufs brouillés & tartines",time:10,tags:["petit-déj","rapide"],batch:false,
 ing:[{n:"Œufs",q:2,u:"pièce",c:"Crèmerie & œufs"},{n:"Pain complet",q:2,u:"tranche",c:"Boulangerie"},{n:"Beurre",q:5,u:"g",c:"Crèmerie & œufs"}],
 steps:"Brouiller les œufs à feu doux. Servir sur pain grillé."},
{id:"r4",name:"Chili sin carne (batch)",time:35,tags:["batch","végétarien","congélation","pas cher"],batch:true,
 ing:[{n:"Haricots rouges (boîte)",q:120,u:"g",c:"Épicerie"},{n:"Tomates concassées",q:150,u:"g",c:"Épicerie"},{n:"Maïs",q:40,u:"g",c:"Épicerie"},{n:"Poivron",q:0.5,u:"pièce",c:"Fruits & légumes"},{n:"Oignon",q:0.5,u:"pièce",c:"Fruits & légumes"},{n:"Riz",q:70,u:"g",c:"Épicerie"}],
 steps:"Revenir oignon + poivron, ajouter le reste, mijoter 20 min. Riz à part. Congeler en portions. Sans piment pour bébé."},
{id:"r5",name:"Bolognaise de lentilles (batch)",time:35,tags:["batch","végétarien","congélation","pas cher"],batch:true,
 ing:[{n:"Lentilles corail",q:60,u:"g",c:"Épicerie"},{n:"Tomates concassées",q:150,u:"g",c:"Épicerie"},{n:"Carotte",q:1,u:"pièce",c:"Fruits & légumes"},{n:"Oignon",q:0.5,u:"pièce",c:"Fruits & légumes"},{n:"Pâtes complètes",q:80,u:"g",c:"Épicerie"}],
 steps:"Cuire lentilles + légumes + tomates 20 min. Servir sur pâtes. Se congèle très bien."},
{id:"r6",name:"Soupe de légumes & œuf dur",time:30,tags:["batch","léger","pas cher"],batch:true,
 ing:[{n:"Pommes de terre",q:1,u:"pièce",c:"Fruits & légumes"},{n:"Carotte",q:1,u:"pièce",c:"Fruits & légumes"},{n:"Poireau",q:1,u:"pièce",c:"Fruits & légumes"},{n:"Œufs",q:1,u:"pièce",c:"Crèmerie & œufs"},{n:"Pain complet",q:1,u:"tranche",c:"Boulangerie"}],
 steps:"Cuire les légumes 20 min, mixer. Servir avec œuf dur et pain. Se transporte en bocal."},
{id:"r7",name:"Poulet rôti, patates douces & brocoli",time:40,tags:["batch","plaque","protéiné"],batch:true,
 ing:[{n:"Cuisses de poulet",q:1,u:"pièce",c:"Viandes & poissons"},{n:"Patate douce",q:1,u:"pièce",c:"Fruits & légumes"},{n:"Brocoli",q:150,u:"g",c:"Fruits & légumes"},{n:"Huile d'olive",q:10,u:"ml",c:"Épicerie"}],
 steps:"Tout sur une plaque, four 200 °C 35 min. Peu de vaisselle."},
{id:"r8",name:"Pâtes thon-tomate-courgette",time:15,tags:["rapide","pas cher"],batch:false,
 ing:[{n:"Pâtes complètes",q:90,u:"g",c:"Épicerie"},{n:"Thon (boîte)",q:60,u:"g",c:"Épicerie"},{n:"Tomates concassées",q:100,u:"g",c:"Épicerie"},{n:"Courgette",q:0.5,u:"pièce",c:"Fruits & légumes"}],
 steps:"Cuire les pâtes, faire revenir courgette, ajouter tomates et thon."},
{id:"r9",name:"Omelette aux légumes & salade",time:12,tags:["rapide","soir"],batch:false,
 ing:[{n:"Œufs",q:3,u:"pièce",c:"Crèmerie & œufs"},{n:"Épinards surgelés",q:80,u:"g",c:"Surgelés"},{n:"Pain complet",q:2,u:"tranche",c:"Boulangerie"}],
 steps:"Omelette avec épinards. Servir avec pain."},
{id:"r10",name:"Houmous, crudités & pain pita",time:5,tags:["collation","sans cuisson","travail"],batch:false,
 ing:[{n:"Houmous",q:60,u:"g",c:"Épicerie"},{n:"Carotte",q:1,u:"pièce",c:"Fruits & légumes"},{n:"Concombre",q:0.25,u:"pièce",c:"Fruits & légumes"},{n:"Pain pita",q:1,u:"pièce",c:"Boulangerie"}],
 steps:"Couper les crudités. Idéal collation de 17h30 pour tenir jusqu'au dîner tardif."},
{id:"r11",name:"Pomme, fromage & amandes",time:1,tags:["collation","sans cuisson","travail"],batch:false,
 ing:[{n:"Pomme",q:1,u:"pièce",c:"Fruits & légumes"},{n:"Fromage (portion)",q:30,u:"g",c:"Crèmerie & œufs"},{n:"Amandes",q:15,u:"g",c:"Épicerie"}],
 steps:"Zéro préparation. Protéines + fibres = satiété."},
{id:"r12",name:"Bowl riz, pois chiches & légumes (travail)",time:20,tags:["batch","travail","micro-ondes","végétarien"],batch:true,
 ing:[{n:"Riz",q:70,u:"g",c:"Épicerie"},{n:"Pois chiches (boîte)",q:100,u:"g",c:"Épicerie"},{n:"Poivron",q:0.5,u:"pièce",c:"Fruits & légumes"},{n:"Courgette",q:0.5,u:"pièce",c:"Fruits & légumes"},{n:"Huile d'olive",q:10,u:"ml",c:"Épicerie"}],
 steps:"Cuire riz, rôtir légumes, mélanger avec pois chiches. Se réchauffe au micro-ondes."},
{id:"r13",name:"Gratin de pâtes & légumes (batch)",time:40,tags:["batch","congélation","bébé ok"],batch:true,
 ing:[{n:"Pâtes complètes",q:80,u:"g",c:"Épicerie"},{n:"Courgette",q:1,u:"pièce",c:"Fruits & légumes"},{n:"Lait",q:100,u:"ml",c:"Crèmerie & œufs"},{n:"Fromage râpé",q:25,u:"g",c:"Crèmerie & œufs"}],
 steps:"Mélanger pâtes cuites, courgette, lait, fromage. Four 20 min. Se congèle en portions."}
];

// ---------- Etat & stockage ----------
const KEY="menusApp_v1";
function weekStart(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(0,0,0,0);return x}
function wkId(d){const x=weekStart(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
let S=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.recipes)return s}catch(e){}
  return {recipes:DEFAULT_RECIPES,plans:{},shop:{},extra:[]};
}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}

let tab="plan", curWeek=weekStart(new Date()), editRecipe=null;

// ---------- Utilitaires ----------
const $=s=>document.querySelector(s);
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">",'"':""","'":"'"}[c]))}
function getPlan(){const id=wkId(curWeek);if(!S.plans[id])S.plans[id]={};return S.plans[id]}
function slotKey(d,s){return d+"_"+s}
function recipeById(id){return S.recipes.find(r=>r.id===id)}
function fmtDate(d){return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}
function portions(who){return PEOPLE.reduce((a,p)=>a+(who.includes(p.id)?p.w:0),0)}
function fmtQ(q){return Math.round(q*10)/10}

// ---------- Rendu ----------
function render(){
  const nav=$("#nav");
  const tabs=[["plan","📅","Planning"],["rec","📖","Recettes"],["shop","🛒","Courses"],["more","⚙️","Plus"]];
  nav.innerHTML=tabs.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("");
  if(tab==="plan")renderPlan();
  else if(tab==="rec")renderRecipes();
  else if(tab==="shop")renderShop();
  else renderMore();
}
function go(t){tab=t;render();window.scrollTo(0,0)}

function renderPlan(){
  const plan=getPlan();
  const end=new Date(curWeek);end.setDate(end.getDate()+6);
  let h=`<div class="wk"><button onclick="chWeek(-1)">‹</button><b>${fmtDate(curWeek)} – ${fmtDate(end)}</b><button onclick="chWeek(1)">›</button></div>`;
  h+=`<div class="tip">💡 Touche un créneau pour choisir une recette, les personnes présentes et le lieu. Une collation vers 17h30 aide à tenir jusqu'au dîner tardif.</div>`;
  DAYS.forEach((dn,di)=>{
    const date=new Date(curWeek);date.setDate(date.getDate()+di);
    h+=`<div class="card"><h3>${dn} <span style="font-weight:400;color:var(--mu);font-size:13px">${fmtDate(date)}</span></h3>`;
    SLOTS.forEach((s,si)=>{
      const e=plan[slotKey(di,s.id)];
      const r=e&&e.rid?recipeById(e.rid):null;
      let body;
      if(e&&e.skip)body=`<span class="empty">Pas à planifier</span>`;
      else if(r){
        const who=e.who.map(w=>PEOPLE.find(p=>p.id===w).label).join(", ");
        body=`<b>${esc(r.name)}</b><span class="meta">${who||"personne"} · ${e.where==="work"?"🏢 travail":"🏠 maison"} · ${r.time} min</span>`;
      } else if(e&&e.free)body=`<b>${esc(e.free)}</b><span class="meta">repas libre</span>`;
      else body=`<span class="empty">+ Ajouter</span>`;
      h+=`<div class="slot ${si===0?"first":""}" onclick="openSlot(${di},'${s.id}')"><div class="lbl">${s.ico} ${s.label}</div><div class="meal">${body}</div></div>`;
    });
    h+=`</div>`;
  });
  h+=`<button class="btn sec" onclick="copyPrev()">Copier la semaine précédente</button><button class="btn dng" onclick="clearWeek()">Vider la semaine</button>`;
  $("#app").innerHTML=h;
}
function chWeek(n){curWeek.setDate(curWeek.getDate()+7*n);render()}
function copyPrev(){
  const prev=new Date(curWeek);prev.setDate(prev.getDate()-7);
  const p=S.plans[wkId(prev)];
  if(!p){alert("Rien à copier la semaine précédente.");return}
  if(!confirm("Remplacer cette semaine par la précédente ?"))return;
  S.plans[wkId(curWeek)]=JSON.parse(JSON.stringify(p));save();render();
}
function clearWeek(){if(confirm("Vider toute cette semaine ?")){S.plans[wkId(curWeek)]={};save();render()}}

// ---------- Modale créneau ----------
let slotState=null;
function openSlot(d,s){
  const e=getPlan()[slotKey(d,s)];
  slotState=e?JSON.parse(JSON.stringify(e)):{rid:null,who:["moi","copine","bebe"],where:"home"};
  slotState.d=d;slotState.s=s;
  drawSlot();
}
function drawSlot(){
  const st=slotState;
  const slotLabel=SLOTS.find(x=>x.id===st.s).label;
  const opts=S.recipes.map(r=>`<option value="${r.id}" ${st.rid===r.id?"selected":""}>${esc(r.name)} (${r.time} min)</option>`).join("");
  const m=document.createElement("div");m.className="modal";m.id="modal";
  m.innerHTML=`<div>
  <h3 style="margin-top:0">${DAYS[st.d]} · ${slotLabel}</h3>
  <label>Recette</label>
  <select id="m_rid"><option value="">— Choisir —</option>${opts}</select>
  <label>Ou repas libre (sans recette)</label>
  <input id="m_free" placeholder="ex : restaurant, restes…" value="${esc(st.free||"")}">
  <label>Qui mange ?</label>
  <div class="chips">${PEOPLE.map(p=>`<div class="chip ${st.who.includes(p.id)?"on":""}" onclick="togWho('${p.id}')">${p.label}</div>`).join("")}</div>
  <label>Où ?</label>
  <div class="chips">
    <div class="chip ${st.where==="home"?"on":""}" onclick="setWhere('home')">🏠 Maison</div>
    <div class="chip ${st.where==="work"?"on":""}" onclick="setWhere('work')">🏢 À emporter (micro-ondes)</div>
  </div>
  <div style="margin-top:12px">
    <button class="btn" onclick="saveSlot()">Enregistrer</button>
    <button class="btn sec" onclick="skipSlot()">Pas à planifier</button>
    <button class="btn dng" onclick="delSlot()">Effacer</button>
    <button class="btn sec" onclick="closeModal()">Annuler</button>
  </div></div>`;
  const old=$("#modal");if(old)old.remove();
  document.body.appendChild(m);
}
function keepInputs(){
  const r=$("#m_rid"),f=$("#m_free");
  if(r)slotState.rid=r.value||null;
  if(f)slotState.free=f.value;
}
function togWho(id){keepInputs();const i=slotState.who.indexOf(id);if(i>=0)slotState.who.splice(i,1);else slotState.who.push(id);drawSlot()}
function setWhere(w){keepInputs();slotState.where=w;drawSlot()}
function saveSlot(){
  keepInputs();
  const k=slotKey(slotState.d,slotState.s);
  const plan=getPlan();
  if(!slotState.rid&&!slotState.free){delete plan[k]}
  else plan[k]={rid:slotState.rid,free:slotState.rid?"":slotState.free,who:slotState.who,where:slotState.where};
  save();closeModal();render();
}
function skipSlot(){getPlan()[slotKey(slotState.d,slotState.s)]={skip:true,who:[]};save();closeModal();render()}
function delSlot(){delete getPlan()[slotKey(slotState.d,slotState.s)];save();closeModal();render()}
function closeModal(){const m=$("#modal");if(m)m.remove()}

// ---------- Recettes ----------
let recFilter="";
function renderRecipes(){
  const q=recFilter.toLowerCase();
  const list=S.recipes.filter(r=>!q||r.name.toLowerCase().includes(q)||r.tags.join(" ").toLowerCase().includes(q));
  let h=`<input placeholder="🔍 Rechercher (ex : batch, rapide, collation…)" value="${esc(recFilter)}" oninput="recFilter=this.value;renderRecipes()" id="rsearch">
  <button class="btn" onclick="newRecipe()">+ Nouvelle recette</button>`;
  list.forEach(r=>{
    h+=`<div class="card" onclick="viewRecipe('${r.id}')"><b>${esc(r.name)}</b> ${r.batch?"📦":""}<br>
    <span class="meta" style="font-size:12px;color:var(--mu)">⏱ ${r.time} min · ${r.ing.length} ingrédients</span><br>
    ${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`;
  });
  $("#app").innerHTML=h;
  const i=$("#rsearch");if(i&&recFilter){i.focus();i.setSelectionRange(recFilter.length,recFilter.length)}
}
function viewRecipe(id){
  const r=recipeById(id);
  const m=document.createElement("div");m.className="modal";m.id="modal";
  m.innerHTML=`<div><h3 style="margin-top:0">${esc(r.name)}</h3>
  <p style="color:var(--mu);font-size:13px">⏱ ${r.time} min ${r.batch?"· 📦 Batch cooking":""}</p>
  <b>Ingrédients (1 adulte)</b>
  <ul>${r.ing.map(i=>`<li>${fmtQ(i.q)} ${esc(i.u)} ${esc(i.n)}</li>`).join("")}</ul>
  <b>Préparation</b><p>${esc(r.steps||"—")}</p>
  <button class="btn" onclick="editR('${r.id}')">Modifier</button>
  <button class="btn dng" onclick="delR('${r.id}')">Supprimer</button>
  <button class="btn sec" onclick="closeModal()">Fermer</button></div>`;
  document.body.appendChild(m);
}
function newRecipe(){editRecipe={id:"u"+Date.now(),name:"",time:15,tags:[],batch:false,ing:[],steps:""};drawEdit(true)}
function editR(id){closeModal();editRecipe=JSON.parse(JSON.stringify(recipeById(id)));drawEdit(false)}
function drawEdit(isNew){
  closeModal();
  const r=editRecipe;
  const m=document.createElement("div");m.className="modal";m.id="modal";
  m.innerHTML=`<div><h3 style="margin-top:0">${isNew?"Nouvelle recette":"Modifier la recette"}</h3>
  <label>Nom</label><input id="e_name" value="${esc(r.name)}">
  <label>Temps (min)</label><input id="e_time" type="number" value="${r.time}">
  <label>Tags (séparés par des virgules)</label><input id="e_tags" value="${esc(r.tags.join(", "))}">
  <label><input type="checkbox" id="e_batch" ${r.batch?"checked":""} style="width:auto"> Batch cooking</label><br>
  <label>Ingrédients pour 1 adulte — un par ligne : <i>quantité ; unité ; nom ; rayon</i><br>Ex : <i>150 ; g ; Brocoli ; Fruits & légumes</i></label>
  <textarea id="e_ing" rows="6">${esc(r.ing.map(i=>[i.q,i.u,i.n,i.c].join(" ; ")).join("\n"))}</textarea>
  <div style="font-size:11px;color:var(--mu);margin-bottom:6px">Rayons : ${CATS.join(" / ")}</div>
  <label>Préparation</label><textarea id="e_steps" rows="4">${esc(r.steps)}</textarea>
  <button class="btn" onclick="saveR()">Enregistrer</button>
  <button class="btn sec" onclick="closeModal()">Annuler</button></div>`;
  document.body.appendChild(m);
}
function saveR(){
  const r=editRecipe;
  r.name=$("#e_name").value.trim();
  if(!r.name){alert("Donne un nom à la recette.");return}
  r.time=parseInt($("#e_time").value)||0;
  r.tags=$("#e_tags").value.split(",").map(t=>t.trim()).filter(Boolean);
  r.batch=$("#e_batch").checked;
  r.steps=$("#e_steps").value;
  r.ing=$("#e_ing").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(";").map(x=>x.trim());
    const c=CATS.includes(p[3])?p[3]:"Autre";
    return {q:parseFloat((p[0]||"1").replace(",","."))||1,u:p[1]||"pièce",n:p[2]||p[0],c:c};
  });
  const i=S.recipes.findIndex(x=>x.id===r.id);
  if(i>=0)S.recipes[i]=r;else S.recipes.push(r);
  save();closeModal();render();
}
function delR(id){
  if(!confirm("Supprimer cette recette ?"))return;
  S.recipes=S.recipes.filter(r=>r.id!==id);save();closeModal();render();
}

// ---------- Courses ----------
function buildShopping(){
  const plan=getPlan();const map={};
  Object.values(plan).forEach(e=>{
    if(!e||!e.rid||e.skip)return;
    const r=recipeById(e.rid);if(!r)return;
    const p=portions(e.who);if(p<=0)return;
    r.ing.forEach(i=>{
      const k=(i.n+"|"+i.u).toLowerCase();
      if(!map[k])map[k]={n:i.n,u:i.u,c:i.c,q:0,k:k};
      map[k].q+=i.q*p;
    });
  });
  return Object.values(map);
}
function renderShop(){
  const wid=wkId(curWeek);
  if(!S.shop[wid])S.shop[wid]={};
  const checks=S.shop[wid];
  const auto=buildShopping();
  const extras=S.extra.filter(x=>x.w===wid);
  let h=`<div class="wk"><button onclick="chWeek(-1);">‹</button><b>Semaine du ${fmtDate(curWeek)}</b><button onclick="chWeek(1);">›</button></div>
  <div style="display:flex;gap:6px"><input id="addItem" placeholder="Ajouter un article…" style="margin:0"><button class="btn" onclick="addItem()" style="margin:0">+</button></div>`;
  const byCat={};
  auto.forEach(i=>{(byCat[i.c]=byCat[i.c]||[]).push({label:`${fmtQ(i.q)} ${i.u} ${i.n}`,k:i.k,extra:false})});
  extras.forEach(x=>{(byCat["Autre"]=byCat["Autre"]||[]).push({label:x.t,k:"x_"+x.id,extra:true,id:x.id})});
  const cats=CATS.filter(c=>byCat[c]);
  if(!cats.length)h+=`<p class="empty" style="margin-top:20px">La liste se remplit toute seule quand tu ajoutes des recettes au planning.</p>`;
  cats.forEach(c=>{
    h+=`<div class="cat">${c}</div>`;
    byCat[c].forEach(i=>{
      const d=checks[i.k];
      h+=`<div class="row ${d?"done":""}"><input type="checkbox" ${d?"checked":""} onchange="togShop('${i.k.replace(/'/g,"\\'")}')"><span class="t">${esc(i.label)}</span>${i.extra?`<button class="x" onclick="delExtra('${i.id}')">✕</button>`:""}</div>`;
    });
  });
  h+=`<div style="margin-top:16px"><button class="btn sec" onclick="shareList()">📤 Partager la liste</button><button class="btn sec" onclick="uncheckAll()">Tout décocher</button></div>
  <p style="font-size:12px;color:var(--mu)">Bébé compte pour 0,4 portion. Vérifie ton frigo/placards avant d'acheter (sel, huile, épices…).</p>`;
  $("#app").innerHTML=h;
}
function togShop(k){const c=S.shop[wkId(curWeek)];c[k]=!c[k];save();renderShop()}
function addItem(){
  const v=$("#addItem").value.trim();if(!v)return;
  S.extra.push({id:Date.now()+"",w:wkId(curWeek),t:v});save();renderShop();
}
function delExtra(id){S.extra=S.extra.filter(x=>x.id!==id);save();renderShop()}
function uncheckAll(){S.shop[wkId(curWeek)]={};save();renderShop()}
function shareList(){
  const wid=wkId(curWeek);const checks=S.shop[wid]||{};
  const lines=["🛒 Courses – semaine du "+fmtDate(curWeek)];
  const byCat={};
  buildShopping().forEach(i=>{if(!checks[i.k])(byCat[i.c]=byCat[i.c]||[]).push(`${fmtQ(i.q)} ${i.u} ${i.n}`)});
  S.extra.filter(x=>x.w===wid&&!checks["x_"+x.id]).forEach(x=>(byCat["Autre"]=byCat["Autre"]||[]).push(x.t));
  CATS.forEach(c=>{if(byCat[c]){lines.push("","— "+c);byCat[c].forEach(l=>lines.push("• "+l))}});
  const txt=lines.join("\n");
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});
  else if(navigator.clipboard){navigator.clipboard.writeText(txt);alert("Liste copiée dans le presse-papiers.")}
  else prompt("Copie la liste :",txt);
}

// ---------- Plus ----------
function renderMore(){
  $("#app").innerHTML=`
  <div class="card"><h3>💾 Sauvegarde & partage entre téléphones</h3>
  <p style="font-size:13px;color:var(--mu)">Les données sont stockées sur ce téléphone. Pour les transférer vers l'autre téléphone (ou faire une sauvegarde), exporte puis importe.</p>
  <button class="btn" onclick="exportData()">Exporter (copier)</button>
  <button class="btn sec" onclick="importData()">Importer (coller)</button></div>
  <div class="card"><h3>🍼 Rappels bébé (17 mois)</h3>
  <p style="font-size:13px">Pas de sel ajouté, épices douces, morceaux adaptés à sa capacité à mâcher. Fer (légumineuses, œufs, viande), poisson 2×/semaine. En cas de doute, demande à votre pédiatre.</p></div>
  <div class="card"><h3>⏰ Astuce jours décalés</h3>
  <p style="font-size:13px">Si tu manges à 14h et dînes à 21h30 : prévois une collation protéines + fibres vers 17h30 (skyr, œuf dur, fromage + fruit, houmous + crudités). Si le petit-déj est à 9h-10h, rends-le consistant.</p></div>
  <div class="card"><h3>⚠️ Zone sensible</h3>
  <button class="btn dng" onclick="resetAll()">Tout réinitialiser</button></div>`;
}
function exportData(){
  const txt=JSON.stringify(S);
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>alert("Données copiées. Colle-les dans un message pour les envoyer.")).catch(()=>prompt("Copie ce texte :",txt))}
  else prompt("Copie ce texte :",txt);
}
function importData(){
  const t=prompt("Colle ici les données exportées :");
  if(!t)return;
  try{const o=JSON.parse(t);if(!o.recipes)throw 0;if(!confirm("Remplacer toutes les données de ce téléphone ?"))return;S=o;save();render();alert("Import réussi.")}
  catch(e){alert("Données invalides.")}
}
function resetAll(){if(confirm("Effacer toutes les données et revenir aux recettes de départ ?")){localStorage.removeItem(KEY);S=load();render()}}

render();
</script>
